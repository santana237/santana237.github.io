<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Support · Wabot Pro">
  <title>Support · Wabot Pro</title>
  <style>
    :root{color-scheme:light;--ink:#132422;--muted:#586b67;--brand:#0f6253;--line:#dce8e4;--bg:#f1f6f4}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:760px;margin:0 auto;padding:42px 20px 64px}.brand{font-weight:800;letter-spacing:.04em;color:var(--brand);text-transform:uppercase;font-size:.78rem}
    h1{font-size:clamp(2rem,6vw,3rem);line-height:1.15}p{color:var(--muted)}a{color:var(--brand);overflow-wrap:anywhere}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;margin:18px 0}
    .button{display:inline-block;margin:8px 0;padding:12px 18px;border-radius:999px;background:var(--brand);color:white;text-decoration:none;font-weight:700}footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
  </style>
</head>
<body><main>
  <div class="brand">Wabot Pro</div>
  <h1>Support</h1>
  <section class="card">
    <p>Wabot Pro helps you send one announcement to your own groups and follow its delivery.</p>
    <p>For a question or a problem, email us with your device model and your app version.</p>
    <a class="button" href="mailto:support@vsptech.host?subject=Wabot%20Pro%20support">Email support</a>
  </section>
  <footer>Wabot Pro · <a href="mailto:support@vsptech.host">support@vsptech.host</a></footer>
</main></body>
</html>
